<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Terminal - DGETI</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        .contenedor-frameset {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100vh;
        }
        .marco-menu {
            flex: 0 0 300px;
            height: 100%;
        }
        .marco-contenido {
            flex: 1;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            display: block;
        }
        @media screen and (max-width: 768px) {
            .contenedor-frameset {
                flex-direction: column;
            }
            .marco-menu {
                flex: 0 0 200px; 
                width: 100%;
            }
            .marco-contenido {
                flex: 1;
                width: 100%;
            }
            .marco-menu {
    flex: 0 0 auto;
    height: 150px;  
}
        }
    </style>
</head>
<body>

    <div class="contenedor-frameset">
        <div class="marco-menu">
            <iframe src="menu.html" name="menu" style="border: none; border-right: 1px solid #767676;"></iframe>
        </div>
        <div class="marco-contenido">
            <iframe src="contenido.html" name="contenido" style="border: none;"></iframe>
        </div>
    </div>

</body>
</html>
